# lightning.pytorch==2.3.2
seed_everything: 0
trainer:
  callbacks:
    - class_path: trainer.callbacks.ValidationCallback
  accelerator: gpu
  devices: [0]
  # accelerator: auto
  # devices: auto
  strategy: ddp_find_unused_parameters_true
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: gwak2_NF
      entity: gwak
  max_epochs: 25
  check_val_every_n_epoch: 1
  # num_sanity_val_steps: 4
  accumulate_grad_batches: 1
ckpt_path: null
model:
  class_path: train.fm_models.BackgroundFlowModel
  init_args:
    embedding_model: null
    embedding_dim: 6
    n_flow_steps: 10
    num_blocks: 32
    learning_rate: 1e-5
    # feats_mode: embedding
    feats_mode: features
    feature_mode: selected-9
    concate_context: false
    apply_context: false
    normalize: true
data:
  class_path: train.dataloader.EmbeddingLoader
  init_args:
    batch_size: 4096