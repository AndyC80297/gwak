# Step 1: python cli.py --config <this> make_seg_list --segment_list segs.npy
make_seg_list:
  ifos: &ifos ["H1", "L1"]
  state_flag: &state_flag ["DMT-ANALYSIS_READY:1", "DMT-ANALYSIS_READY:1"]
  open_state_flag: ["H1_BURST_CAT3", "L1_BURST_CAT3"]
  version_tag: &version_tag O4_cat3_MDC_background
  ana_start: 1401544825 # to match O4b-2 from MDC https://git.ligo.org/bursts/burst-pipeline-benchmark/-/wikis/o4b_2/O4b-2
  ana_end: 1403964034
  dqsegdb_url: https://segments.igwn.org
  # host: datafind.ldas.cit:80 #
  host: &host datafind.igwn.org
  logger: null

# Step 2: python cli.py --config <this> get_strain --segments segs.npy
get_strain:
  ifos: *ifos
  state_flag: *state_flag
  version_tag: *version_tag
  channels: ["GDS-CALIB_STRAIN_CLEAN", "GDS-CALIB_STRAIN_CLEAN"]
  frame_type: ["HOFT_C00", "HOFT_C00"]
  sample_rate: 4096
  save_dir: null
  verbose: False
  host: *host
  logger: null
  compression: lzf # lzf, gzip, or null
  overwrite: False
